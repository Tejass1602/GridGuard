name: GridGuard CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - run: python3 scripts/train_nilm.py
      - run: cmake -S firmware/lib/gridguard_core -B build/core
      - run: cmake --build build/core --parallel
      - run: ctest --test-dir build/core --output-on-failure
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: host/backend
      - run: pytest -q
        working-directory: host/backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: host/frontend
      - run: npm run build
        working-directory: host/frontend
